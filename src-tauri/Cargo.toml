[package]
name = "ark-asa-config"
version = "2.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["MaxiusOfMaximus"]
license = "MIT"
default-run = "ark-asa-config"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "devtools", "tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-stronghold = "2"
keyring = { version = "4", features = ["v1"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
walkdir = "2.4"
zip = "2"
base64 = { version = "0.22", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sha1_smol = "1"
# Native Windows API for connectivity detection via INetworkListManager.
windows = { version = "0.58", features = [
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_Foundation",
] }
windows-core = "0.58"
# v2.2 — multi-channel chat bridge WebSocket support (Discord, Slack, Supabase, InsForge)
tungstenite = "0.21"
tokio-tungstenite = "0.21"
# v2.2 — local SQLite audit-log DAO (default, no network required)
rusqlite = { version = "0.31", features = ["bundled"] }
# v2.1 — remote admin API + auth
axum = { version = "0.7", features = ["json", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
jsonwebtoken = "9.3"
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

# Stronghold uses argon2 which depends on scrypt; without this profile override
# the dev build of scrypt runs unoptimized and key derivation takes 30+ seconds
# on every Stronghold unlock. Upstream-recommended workaround per
# https://v2.tauri.app/plugin/stronghold/ — keep for release is unaffected
# because [profile.release] already sets opt-level=3 globally.
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "ark-asa-config"
path = "src/main.rs"
