[package]
name = "ark-core"
version = "2.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["MaxiusOfMaximus"]
license = "MIT"
description = "Platform-agnostic core of the ARK ASA Configuration Manager (config schema, TOML/INI, profiles, validation)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
thiserror = "1.0"
log = "0.4"
tokio = { version = "1.40", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
# Pure-Rust embedded key-value store. No C dependency, so it cross-compiles to
# Android/iOS with no extra toolchain; ACID and crash-safe.
redb = "4.3"

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
