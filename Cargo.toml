[package]
name = "ark-asa-config"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MaxiusOfMaximus"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.0" }

[dependencies]
tauri = { version = "2.0", features = ["shell-open", "window-all", "process-all", "fs-all"] }
tauri-plugin-store = "2.0"
tauri-plugin-shell = { version = "2.0", features = ["open"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"
anyhow = "1.0"
once_cell = "1.19"
lazy_static = "1.4"
walkdir = "2.4"
mockall = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "ark-asa-config"
path = "src/main.rs"

[[bin]]
name = "ark-config"
path = "src/bin/ark-config.rs"
